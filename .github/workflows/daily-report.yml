name: Daily High Pain Report

on:
  # Target: 08:00 PM IST (14:30 UTC).
  # Four attempts spread over 2 hrs — first one to run sets the Firebase flag, rest skip.
  schedule:
    - cron: '30 14 * * *'
    - cron: '0 15 * * *'
    - cron: '30 15 * * *'
    - cron: '0 16 * * *'

  # Allow manual trigger for testing; force=true bypasses the once-a-day flag
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if the report already went out today'
        required: false
        default: 'false'

jobs:
  report:
    name: Send Daily Funnel Report to Slack
    if: github.repository == 'shariqkhan-ui/hp-customer-tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send daily report
        working-directory: scripts
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE_RUN: ${{ github.event.inputs.force || 'false' }}
        run: node daily-report.js
