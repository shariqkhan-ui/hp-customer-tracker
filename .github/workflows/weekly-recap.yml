name: Weekly 48h Recap

on:
  schedule:
    # Mondays 09:30 IST (04:00 UTC)
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recap:
    if: github.repository == 'shariqkhan-ui/hp-customer-tracker'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build recap + DM Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: node scripts/weekly-recap.js

      - name: Commit recap.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add recap.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly recap: $(date -u +%Y-%m-%d)"
            git push
          fi
