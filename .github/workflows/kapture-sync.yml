name: Kapture Auto-Sync

on:
  # Schedule DISABLED 1 Sep 2026 — the sync now runs on Railway (service
  # kapture-sync-cron, cron '0,30 2-13 * * *' UTC, auto-deploys from master).
  # GitHub's scheduler proved unreliable (27-31 Aug stall). This workflow is
  # kept for manual dispatch as a fallback.

  # Allow manual trigger from GitHub Actions UI for testing
  workflow_dispatch:
    inputs:
      backfill_chat:
        description: 'One-time: backfill ALL open chat tickets >72h (no 14-day cap, Slack silent). Leave false for normal runs.'
        type: boolean
        default: false

jobs:
  sync:
    name: Sync Kapture → High Pain Tracker
    if: github.repository == 'shariqkhan-ui/hp-customer-tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Kapture sync
        working-directory: scripts
        env:
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # true only when manually dispatched with the backfill toggle on.
          BACKFILL_CHAT: ${{ github.event.inputs.backfill_chat }}
        run: node kapture-sync.js
