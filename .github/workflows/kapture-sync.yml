name: Kapture Auto-Sync

on:
  # Runs every 30 min from 8:00 AM IST (02:30 UTC) to 7:00 PM IST (13:30 UTC).
  schedule:
    - cron: '30 2-13 * * *'
    - cron: '0 3-13 * * *'

  # Allow manual trigger from GitHub Actions UI for testing
  workflow_dispatch:
    inputs:
      backfill_chat:
        description: 'One-time: backfill ALL open chat tickets >72h (no 14-day cap, Slack silent). Leave false for normal runs.'
        type: boolean
        default: false

jobs:
  sync:
    name: Sync Kapture → High Pain Tracker
    if: github.repository == 'shariqkhan-ui/hp-customer-tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Kapture sync
        working-directory: scripts
        env:
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # true only when manually dispatched with the backfill toggle on.
          BACKFILL_CHAT: ${{ github.event.inputs.backfill_chat }}
        run: node kapture-sync.js
